name: CI

on:
    push:
        branches:
            - main
    pull_request_target:
        types:
            - closed
        branches:
            - main

permissions:
    contents: read
    pull-requests: write

jobs:
    checks:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npx tsc --noEmit

            - name: Tests
              run: npm test -- --ci

            - name: Expo Doctor
              run: npx expo-doctor

    preview_ios_build:
        if: >
            (
                github.event_name == 'pull_request_target' &&
                github.event.pull_request.merged == true &&
                (
                    contains(github.event.pull_request.title, '[preview]') ||
                    contains(github.event.pull_request.body, '[preview]')
                )
            ) ||
            (
                github.event_name == 'push' &&
                github.ref == 'refs/heads/main' &&
                contains(github.event.head_commit.message, '[preview]')
            )
        runs-on: ubuntu-latest
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        steps:
            - name: Checkout merged commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Setup EAS CLI
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Start iOS preview build
              id: eas_build
              run: |
                  set -eu
                  npx eas-cli build --platform ios --profile preview --non-interactive --json > eas-build.json
                  node <<'NODE'
                  const fs = require('fs')
                  const output = fs.readFileSync('eas-build.json', 'utf8').trim()
                  const maybeJson = output.split('\n').filter(Boolean).find((line) => line.startsWith('{') || line.startsWith('['))
                  if (!maybeJson) {
                    throw new Error('Could not parse JSON output from EAS build')
                  }
                  const parsed = JSON.parse(maybeJson)
                  const build = Array.isArray(parsed) ? parsed[0] : parsed
                  const detailsUrl =
                    build.buildDetailsPageUrl ||
                    build.detailsPageUrl ||
                    build.logs?.url ||
                    ''
                  const artifactUrl =
                    build.artifacts?.buildUrl ||
                    build.artifacts?.applicationArchiveUrl ||
                    ''
                  const id = build.id || ''
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${id}\n`)
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `details_url=${detailsUrl}\n`)
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_url=${artifactUrl}\n`)
                  NODE

            - name: Add build links to summary
              run: |
                  {
                    echo "### iOS preview build started"
                    echo ""
                    echo "- Build ID: \`${{ steps.eas_build.outputs.build_id }}\`"
                    echo "- Build details: ${{ steps.eas_build.outputs.details_url }}"
                    if [ -n "${{ steps.eas_build.outputs.artifact_url }}" ]; then
                      echo "- Download link: ${{ steps.eas_build.outputs.artifact_url }}"
                    else
                      echo "- Download link: available after build completes in the Build details page"
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Comment on PR with build links
              if: github.event_name == 'pull_request_target'
              uses: actions/github-script@v7
              with:
                  script: |
                      const mention = `@${context.actor}`
                      const detailsUrl = `${{ steps.eas_build.outputs.details_url }}`
                      const artifactUrl = `${{ steps.eas_build.outputs.artifact_url }}`
                      const lines = [
                        mention,
                        '',
                        'iOS preview build started via `[preview]` keyword.',
                        '',
                        `- Build details: ${detailsUrl || 'Not available'}`,
                        artifactUrl
                          ? `- Download link: ${artifactUrl}`
                          : '- Download link: available after build completes in the Build details page',
                      ]
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.payload.pull_request.number,
                        body: lines.join('\n'),
                      })

            - name: Comment on commit with build links
              if: github.event_name == 'push'
              uses: actions/github-script@v7
              with:
                  script: |
                      const mention = `@${context.actor}`
                      const detailsUrl = `${{ steps.eas_build.outputs.details_url }}`
                      const artifactUrl = `${{ steps.eas_build.outputs.artifact_url }}`
                      const lines = [
                        mention,
                        '',
                        'iOS preview build started via `[preview]` keyword in commit message.',
                        '',
                        `- Build details: ${detailsUrl || 'Not available'}`,
                        artifactUrl
                          ? `- Download link: ${artifactUrl}`
                          : '- Download link: available after build completes in the Build details page',
                      ]
                      await github.rest.repos.createCommitComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        commit_sha: context.sha,
                        body: lines.join('\n'),
                      })
